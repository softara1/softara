<!-- ===== Awad Tech fix r41.1: forum topics fix + ticker/mega smart fallback (coexists with restored native engine) ===== -->
<style>

.sq-mega-inner{display:flex;align-items:stretch;justify-content:space-between}
.sq-mega-inner .mega-post{flex:1 1 0;min-width:0}
.sq-mega-inner .img-wrap{overflow:hidden;background:#333}
.sq-mega-inner .img-wrap img{width:100%;height:180px;object-fit:cover;display:block}
@media(max-width:768px){.sq-mega-inner{flex-wrap:wrap}.sq-mega-inner .mega-post{flex:1 1 45%}}
.ticker-content ul.sq-live{animation:sqTickMove 45s linear infinite}
.tick:hover .ticker-content ul.sq-live,#tick:hover .ticker-content ul.sq-live{animation-play-state:paused}
@keyframes sqTickMove{from{transform:translateX(0)}to{transform:translateX(50%)}}
</style>
<script>
/*<![CDATA[*/
(function () {
  'use strict';
  var seq = 0;
  function jsonp(path, cb) {
    var name = 'sqFixCb' + (++seq) + '_' + Date.now();
    var s = document.createElement('script');
    var t = setTimeout(function () { clean(); cb(null); }, 12000);
    function clean() { clearTimeout(t); try { delete window[name]; } catch (e) {} if (s.parentNode) s.parentNode.removeChild(s); }
    window[name] = function (json) { clean(); cb(json); };
    s.onerror = function () { clean(); cb(null); };
    s.src = path + (path.indexOf('?') > -1 ? '&' : '?') + 'callback=' + name;
    document.body.appendChild(s);
  }
  function postUrl(e) { var l = e.link || []; for (var i = 0; i < l.length; i++) { if (l[i].rel === 'alternate') return l[i].href; } return '#'; }
  function thumb(e) {
    var u = e.media$thumbnail && e.media$thumbnail.url;
    if (u) return u.replace(/\/s72-c(-[a-z]+)?\//, '/w320-h180-c/');
    var m = ((e.content && e.content.$t) || '').match(/<img[^>]+src=["']([^"']+)/);
    return m ? m[1] : '';
  }
  function fmtDate(e) {
    try { var d = new Date(e.published.$t);
      var m = ['\u064A\u0646\u0627\u064A\u0631','\u0641\u0628\u0631\u0627\u064A\u0631','\u0645\u0627\u0631\u0633','\u0623\u0628\u0631\u064A\u0644','\u0645\u0627\u064A\u0648','\u064A\u0648\u0646\u064A\u0648','\u064A\u0648\u0644\u064A\u0648','\u0623\u063A\u0633\u0637\u0633','\u0633\u0628\u062A\u0645\u0628\u0631','\u0623\u0643\u062A\u0648\u0628\u0631','\u0646\u0648\u0641\u0645\u0628\u0631','\u062F\u064A\u0633\u0645\u0628\u0631'];
      return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
    } catch (x) { return ''; }
  }

  /* P1 - hot news ticker: FALLBACK ONLY - native engine fills on first scroll */
  function fixTicker() {
    var tick = document.getElementById('tick');
    if (!tick) return;
    setTimeout(function () {
      var box = tick.querySelector('.ticker-content');
      if (!box || box.querySelector('a')) return;
      var hid = tick.closest('.hide');
      if (hid) hid.classList.remove('hide');
      jsonp('/feeds/posts/default?alt=json-in-script&orderby=published&max-results=10', function (json) {
        if (box.querySelector('a')) return;
        var es = (json && json.feed && json.feed.entry) || [];
        if (!es.length) return;
      var ul = document.createElement('ul');
      es.forEach(function (e) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = postUrl(e); a.textContent = (e.title && e.title.$t) || '';
        li.appendChild(a); ul.appendChild(li);
      });
      ul.innerHTML += ul.innerHTML;
      ul.className = 'sq-live';
      var nav = document.createElement('nav');
      nav.appendChild(ul);
        box.innerHTML = ''; box.appendChild(nav);
      });
    }, 6000);
  }

  /* P2 - section mega menus */
  function fillMega(item) {
    var a = item.querySelector('a'), wrap = item.querySelector('.mega-wrap');
    if (!a || !wrap) return;
    if (wrap.querySelector('.mega-post')) return; /* native engine already filled */
    if (wrap.getAttribute('data-sq')) return;
    var href = (a.getAttribute('href') || '').trim();
    var m = href.match(/\/search\/label\/([^?\/]+)/);
    var label = m ? decodeURIComponent(m[1]) : href.replace(/^#/, '').trim();
    if (!label || label.charAt(0) === '/') return;
    wrap.setAttribute('data-sq', '1');
    wrap.innerHTML = '<i class="fa fa-spin fa-circle-o-notch"></i>';
    jsonp('/feeds/posts/default/-/' + encodeURIComponent(label) + '?alt=json-in-script&orderby=published&max-results=4', function (json) {
      var es = (json && json.feed && json.feed.entry) || [];
      if (!es.length) { wrap.innerHTML = ''; return; }
      var inner = document.createElement('div');
      inner.className = 'sq-mega-inner';
      es.forEach(function (e) {
        var url = postUrl(e), img = thumb(e);
        var card = document.createElement('div');
        card.className = 'mega-post';
        card.innerHTML = '<a href="' + url + '">' + (img ? '<div class="img-wrap"><img alt="" loading="lazy" src="' + img + '"/></div>' : '') + '</a>' +
          '<h3 class="post-title"><a href="' + url + '">' + ((e.title && e.title.$t) || '') + '</a></h3>' +
          '<div class="details"><span class="post-date"><i class="fa fa-calendar"></i> ' + fmtDate(e) + '</span></div>';
        inner.appendChild(card);
      });
      wrap.innerHTML = ''; wrap.appendChild(inner);
    });
  }
  function fixMega() {
    var items = document.querySelectorAll('li.MegaItem');
    /* timed pre-fill: native engine fills on hover; we fill any still-empty one at 8s */
    setTimeout(function () {
      for (var j = 0; j < items.length; j++) fillMega(items[j]);
    }, 8000);
    for (var i = 0; i < items.length; i++) {
      (function (item) {
        item.addEventListener('mouseenter', function () { fillMega(item); var w = item.querySelector('.mega-wrap'); if (w) w.classList.add('open'); });
        item.addEventListener('mouseleave', function () { var w = item.querySelector('.mega-wrap'); if (w) w.classList.remove('open'); });
        var a = item.querySelector('a');
        if (a) a.addEventListener('click', function (ev) {
          var w = item.querySelector('.mega-wrap');
          if (w && window.innerWidth <= 992 && w.innerHTML !== '' && !w.classList.contains('open')) { ev.preventDefault(); w.classList.add('open'); return; }
          var h = a.getAttribute('href') || '';
          if (h.charAt(0) === '#' && h.length > 1) { ev.preventDefault(); location.href = '/search/label/' + encodeURIComponent(h.slice(1)); }
        });
      })(items[i]);
    }
  }

/* P3 - forum topics: direct fetch instead of blocked rss2json */
  var forumFetches = 0;
  function fillForum() {
    var box = document.querySelector('.sf-vertical-ticker');
    if (!box) return;
    if (forumFetches >= 3) return;
    var list = document.getElementById('sf-vt-list');
    if (!list) {
      /* rebuild structure if destroyed by the legacy script */
      box.innerHTML = '<div class="sf-vt-title">\u0645\u0648\u0627\u0636\u064A\u0639\u0020\u0627\u0644\u0645\u0646\u062A\u062F\u0649</div><div class="sf-vt-body"><ul id="sf-vt-list"></ul></div>';
      list = document.getElementById('sf-vt-list');
      if (!list) return;
    }
    forumFetches++;
    fetch('https://softara.yoo7.com/feed/', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (txt) {
        var doc = new DOMParser().parseFromString(txt, 'text/xml');
        var items = doc.querySelectorAll('item');
        if (!items.length) throw 0;
        list.innerHTML = '';
        var n = 0;
        for (var i = 0; i < items.length && n < 12; i++) {
          var t = items[i].querySelector('title'), l = items[i].querySelector('link');
          if (!t || !l) continue;
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = (l.textContent || '').trim();
          a.textContent = (t.textContent || '').trim();
          a.target = '_blank'; a.rel = 'noopener';
          li.appendChild(a); list.appendChild(li); n++;
        }
        if (!n) throw 0;
        list.innerHTML += list.innerHTML;
      })
      .catch(function () {
        var cur = document.getElementById('sf-vt-list');
        if (!cur) { box.innerHTML = '<div class="sf-vt-title">\u062A\u0639\u0630\u0631\u0020\u062A\u062D\u0645\u064A\u0644\u0020\u0627\u0644\u0645\u0648\u0627\u0636\u064A\u0639</div>'; }
      });
  }
  function forumWatchdog() {
    var tries = 0, ok = 0;
    var iv = setInterval(function () {
      tries++;
      var box = document.querySelector('.sf-vertical-ticker');
      var list = document.getElementById('sf-vt-list');
      var broken = !box || !list || list.children.length === 0;
      if (broken) { fillForum(); ok = 0; } else { ok++; }
      if (ok >= 3 || tries > 10) clearInterval(iv);
    }, 3000);
  }

  function start() { fixTicker(); fixMega(); fillForum(); forumWatchdog(); }
  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start);
})();
/*]]>*/
</script>
<!-- ===== end Awad Tech fix r41.1 ===== -->
